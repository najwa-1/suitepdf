name: Build Android APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SuitePDF.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuitePDF-Android
          path: SuitePDF.apk
      - name: Attach APK to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" SuitePDF.apk --clobber
      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" SuitePDF.apk --clobber
          else
            gh release create "$RELEASE_TAG" SuitePDF.apk --title "SuitePDF $RELEASE_TAG" --generate-notes
          fi
